name: Build Natives

# Builds the Dawn shared library for every supported platform and architecture. Nothing is committed:
# each library is uploaded as a workflow artifact, and a final job bundles them all into one artifact
# laid out exactly like the repository (the resources of each natives module and Android jniLibs), so release jobs and people
# can drop it straight into a checkout. The Dawn revision comes from scripts/dawn.version.
on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - 'scripts/dawn.version'
      - 'scripts/build_natives.sh'
      - 'scripts/natives/**'
      - '.github/workflows/natives.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Dawn (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # Building inside manylinux_2_28 (AlmaLinux 8, glibc 2.28) keeps the library loadable on every
    # mainstream distribution released since 2018, not only on the runner's much newer glibc.
    container: quay.io/pypa/manylinux_2_28_${{ matrix.arch }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04
            arch: x86_64
          - target: linux-aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
    env:
      JWEBGPU_DAWN_CACHE: /github/home/.cache/jwebgpu/dawn
      # One library serves both window systems: Dawn picks X11 (Xlib or XCB) or Wayland at run time.
      JWEBGPU_X11: 'ON'
      JWEBGPU_WAYLAND: 'ON'
      JWEBGPU_MAX_GLIBC: '2.28'
    defaults:
      run:
        shell: bash
    steps:
      - name: Install build dependencies
        # The X11 headers are needed to compile Dawn's X11 surface support. Dawn ships the Wayland
        # headers it needs. CMake and Ninja come from the image's Python 3.12.
        run: |
          dnf install -y git libX11-devel libxcb-devel
          /opt/python/cp312-cp312/bin/python -m pip install cmake ninja
          echo "/opt/python/cp312-cp312/bin" >> "$GITHUB_PATH"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore the Dawn sources cache
        id: sources
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.JWEBGPU_DAWN_CACHE }}/src
          key: dawn-src-Linux-${{ hashFiles('scripts/dawn.version') }}

      - name: Fetch the Dawn sources
        run: |
          git config --global --add safe.directory '*'
          ./scripts/build_natives.sh fetch

      - name: Save the Dawn sources cache
        if: steps.sources.outputs.cache-hit != 'true'
        # Saved before the build starts, so a build failure does not throw away the long download.
        uses: actions/cache/save@v4
        with:
          path: ${{ env.JWEBGPU_DAWN_CACHE }}/src
          key: ${{ steps.sources.outputs.cache-primary-key }}

      - name: Build Dawn
        run: ./scripts/build_natives.sh ${{ matrix.target }}

      - name: Upload the library
        uses: actions/upload-artifact@v7
        with:
          name: dawn-${{ matrix.target }}
          path: jwebgpu-natives/${{ matrix.target }}/src/main/resources/natives/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30

  desktop:
    name: Dawn (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    # A cold Dawn build takes about 25 minutes on 8 cores and much longer on 2 to 4 cores.
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
            msvc_arch: x64
            # Windows paths are limited to 260 characters and Dawn trees are deep, so keep the root short.
            cache_dir: C:/jwdawn
          - target: windows-aarch64
            os: windows-11-arm
            msvc_arch: arm64
            cache_dir: C:/jwdawn
          - target: macos-x86_64
            os: macos-15-intel
            cache_dir: ~/.cache/jwebgpu/dawn
          - target: macos-aarch64
            os: macos-latest
            cache_dir: ~/.cache/jwebgpu/dawn
    env:
      JWEBGPU_DAWN_CACHE: ${{ matrix.cache_dir }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: python -m pip install ninja

      - name: Set up the MSVC toolchain
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Prepare Windows git and PATH
        if: runner.os == 'Windows'
        run: |
          git config --global core.longpaths true
          # Git Bash ships a GNU link.exe that would shadow the MSVC linker.
          rm -f /usr/bin/link.exe /usr/bin/link

      - name: Restore the Dawn sources cache
        id: sources
        uses: actions/cache/restore@v4
        with:
          path: ${{ matrix.cache_dir }}/src
          key: dawn-src-${{ runner.os }}-${{ hashFiles('scripts/dawn.version') }}

      - name: Fetch the Dawn sources
        run: ./scripts/build_natives.sh fetch

      - name: Save the Dawn sources cache
        if: steps.sources.outputs.cache-hit != 'true'
        # Saved before the build starts, so a build failure does not throw away the long download.
        # Only sources are cached: a Dawn build tree is several GB per target, which would overflow
        # the 10 GB repository cache quota, and a Dawn bump changes nearly every object file anyway.
        uses: actions/cache/save@v4
        with:
          path: ${{ matrix.cache_dir }}/src
          key: ${{ steps.sources.outputs.cache-primary-key }}

      - name: Build Dawn
        run: ./scripts/build_natives.sh ${{ matrix.target }}

      - name: Upload the library
        uses: actions/upload-artifact@v7
        with:
          name: dawn-${{ matrix.target }}
          path: jwebgpu-natives/${{ matrix.target }}/src/main/resources/natives/${{ matrix.target }}/*
          if-no-files-found: error
          retention-days: 30

  android:
    name: Dawn (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android-arm64-v8a
            abi: arm64-v8a
          - target: android-x86_64
            abi: x86_64
    env:
      JWEBGPU_ANDROID_API: '26'
      NDK_VERSION: '28.2.13676358'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Ninja
        run: python -m pip install ninja

      - name: Install the Android NDK
        # The runner image ships the Android SDK. Pin the NDK so every build uses the same compiler.
        run: |
          # "yes" is killed by a broken pipe once sdkmanager stops reading, which pipefail would treat
          # as a failure, so its exit status is ignored.
          (yes || true) | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --install "ndk;${NDK_VERSION}" > /dev/null
          echo "JWEBGPU_ANDROID_NDK=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - name: Restore the Dawn sources cache
        id: sources
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/jwebgpu/dawn/src
          key: dawn-src-Android-${{ hashFiles('scripts/dawn.version') }}

      - name: Fetch the Dawn sources
        run: ./scripts/build_natives.sh fetch

      - name: Save the Dawn sources cache
        if: steps.sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/jwebgpu/dawn/src
          key: ${{ steps.sources.outputs.cache-primary-key }}

      - name: Build Dawn
        run: ./scripts/build_natives.sh ${{ matrix.target }}

      - name: Upload the library
        uses: actions/upload-artifact@v7
        with:
          name: dawn-${{ matrix.target }}
          path: jwebgpu-jni/src/main/jniLibs/${{ matrix.abi }}/*
          if-no-files-found: error
          retention-days: 30

  bundle:
    name: Bundle all natives
    needs: [linux, desktop, android]
    runs-on: ubuntu-24.04
    steps:
      - name: Download every library
        uses: actions/download-artifact@v4
        with:
          pattern: dawn-*
          path: artifacts

      - name: Lay them out like the repository
        run: |
          mkdir -p bundle/jwebgpu-natives bundle/jwebgpu-jni/src/main/jniLibs
          for dir in artifacts/dawn-*; do
            target="${dir#artifacts/dawn-}"
            case "${target}" in
              android-*) dest="bundle/jwebgpu-jni/src/main/jniLibs/${target#android-}" ;;
              *) dest="bundle/jwebgpu-natives/${target}/src/main/resources/natives/${target}" ;;
            esac
            mkdir -p "${dest}"
            cp -r "${dir}/." "${dest}/"
          done
          find bundle -type f -exec ls -l {} \;

      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: dawn-natives-all
          path: bundle/
          if-no-files-found: error
          retention-days: 30
