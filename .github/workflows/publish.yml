name: Publish to Maven Central

# Triggers on any tag of the form v1.2.3 (pushed to master).
# The build derives the artifact version from the tag via git describe: v1.2.3 -> 1.2.3.
on:
  push:
    tags:
      - 'v*'

jobs:
  # Run the same checks CI normally runs on branch pushes before we publish anything.
  validate:
    name: Pre-publish validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Check formatting (Spotless)
        run: ./gradlew spotlessCheck --no-daemon --warning-mode all

      - name: Run unit tests
        run: ./gradlew :jwebgpu-test:test --no-daemon --warning-mode all

  publish:
    name: Publish artifacts
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # Android natives will be built by a separate natives workflow, so no NDK or CMake is needed here.
          packages: "platform-tools platforms;android-36 build-tools;36.0.0"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Download the Dawn libraries
        # The jwebgpu-natives-* modules publish the libraries that the Build Natives workflow built. Publishing fails
        # if a library is missing, so a release can never ship an empty natives jar. The per-target artifacts are
        # downloaded instead of the dawn-natives-all bundle and placed with this checkout's layout, so a natives run
        # made before a module rename still lands where the tagged code expects it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow natives.yml --branch master --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          echo "Using the libraries of Build Natives run ${run_id}."
          gh run download "${run_id}" --pattern 'dawn-*' --dir natives-artifacts
          for dir in natives-artifacts/dawn-*; do
            target="${dir#natives-artifacts/dawn-}"
            case "${target}" in
              natives-all) continue ;;
              android-*) dest="jwebgpu-jni/src/main/jniLibs/${target#android-}" ;;
              *) dest="jwebgpu-natives/jwebgpu-natives-${target}/src/main/resources/natives/${target}" ;;
            esac
            mkdir -p "${dest}"
            cp -r "${dir}/." "${dest}/"
          done
          find jwebgpu-natives jwebgpu-jni/src/main/jniLibs -type f \( -name '*.so' -o -name '*.dll' -o -name '*.dylib' \) -exec ls -l {} \;

      - name: Publish to Maven Central
        # Secrets are injected as Gradle project properties via the ORG_GRADLE_PROJECT_ prefix.
        # signingInMemoryKey is the ASCII-armored GPG private key (supports newlines safely as an env var).
        # The artifact version is derived from the git tag: v1.2.3 -> 1.2.3.
        env:
          ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.SIGNING_KEY_ID }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.SIGNING_PASSWORD }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_PASSWORD }}
        run: |
          ./gradlew publishAllPublicationsToMavenCentralRepository \
            -PincludeAndroid=true \
            --no-daemon \
            --warning-mode all
